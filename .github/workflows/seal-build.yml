name: seal-build

# JGit has no GitHub Actions CI upstream (it builds on Eclipse Hudson/Gerrit).
# This workflow mirrors the project's documented build: `mvn clean install`
# over the whole reactor with Java 8 and Maven 3.5.2 (the release's
# Build-Jdk / Created-By), running every module's JUnit suite.
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Space or comma separated surefire test selectors (empty = full suite)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Maven 3.5.2
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.5.2/binaries/apache-maven-3.5.2-bin.tar.gz -o /tmp/maven.tgz
          sudo tar -xzf /tmp/maven.tgz -C /opt
          echo "/opt/apache-maven-3.5.2/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          java -version
          mvn -version

      # WalkEncryptionTest (the only suite exercising transport/AmazonS3.java)
      # needs a live S3 endpoint. Run a local moto S3 server on port 80
      # (AmazonS3 builds http://<bucket>.<domain>/ URLs with no port, and moto
      # routes a dotted non-AWS Host header to the bucket named by its first
      # label) and point the test's ~/jgit-s3-config.properties at it via
      # AmazonS3's `domain` key. Serve moto's S3 backend app alone: the
      # multi-service `moto.server` infers the service by parsing the
      # Authorization header as SigV4, and AmazonS3's SigV2 "AWS key:sig"
      # header is mis-routed (HTTP 500) whenever the base64 signature happens
      # to contain four '/' characters.
      - name: Start local S3 (moto) for WalkEncryptionTest
        run: |
          python3 -m venv /tmp/moto
          /tmp/moto/bin/pip install -q "moto[server]==5.0.28"
          printf '%s\n' \
            'import sys' \
            'from moto.moto_server.werkzeug_app import create_backend_app' \
            'create_backend_app("s3").run(host=sys.argv[1], port=int(sys.argv[2]), threaded=True)' > /tmp/moto/s3only.py
          sudo nohup /tmp/moto/bin/python /tmp/moto/s3only.py 127.0.0.1 80 > /tmp/moto.log 2>&1 &
          echo "127.0.0.1 s3.local jgit-test-bucket.s3.local" | sudo tee -a /etc/hosts
          for i in $(seq 1 30); do
            curl -fsS -m 5 -X PUT http://127.0.0.1/jgit-test-bucket && break
            sleep 2
          done
          curl -fsS http://jgit-test-bucket.s3.local/ | head -c 400; echo
          printf '%s\n' \
            'accesskey=jgitlocalaccess' \
            'secretkey=jgitlocalsecret' \
            'test.bucket=jgit-test-bucket' \
            'domain=s3.local' > "$HOME/jgit-s3-config.properties"

      - name: Build and test
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
          # WalkEncryptionTest.permitLongTests() enables its S3 crypto round
          # trips only on JGit's own CI, detected via HUDSON_HOME (or the
          # test.long profile, whose argLine would drop -Xmx/tmpdir).
          HUDSON_HOME: /tmp/hudson
        run: |
          if [ -n "$TEST_FILTER" ]; then
            SELECTOR="$(echo "$TEST_FILTER" | tr ' ' ',')"
            mvn -B -V clean install -Dtest="$SELECTOR" -DfailIfNoTests=false
          else
            mvn -B -V clean install
          fi

      - name: Report skipped tests
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          # Why each environment-conditional assumption skip fires on a Linux
          # runner (the assumption itself prints only "got: <false>").
          REASONS = {
              "CheckoutCommandTest.testNonDeletableFilesOnWindows": "assumeTrue(isWindows()) - Windows-only file locking behaviour",
              "CheckoutCommandTest.testCheckoutAutoCrlfTrue": "assumeTrue(foundUnsmudged) - timing-dependent: only asserts when the index entry was not racily smudged",
              "IndexDiffWithSymlinkTest": "assumeTrue(isMacOS() && supportsSymlinks()) - macOS NFD filename-encoding test",
              "BatchRefUpdateTest.atomicUpdateRespectsInProcessLock": "assumeTrue(atomic) - only meaningful for the atomic=true parameter, which ran",
              "ObjectDirectoryTest.testScanningForPackfiles": "assumeTrue(tmpFile.lastModified() == pack.lastModified()) - needs coarse filesystem mtimes; ext4 has nanosecond mtimes",
              "WalkEncryptionTest$TestableTransformation": "assumeTrue(isAlgorithmTestable(props)) - JGit crypto Version 1 needs SecretKeyFactory.getInstance(<profile>), which no JCE provider offers for raw AES_n/<mode>/NOPADDING transformations (logged as 'Missing ... Present: false'); not installable, the combination is unsupported by design",
              "MergeGitAttributeTest.mergeBinaryFile_NoAttr_Conflict": "@Ignore upstream - binary merge without attributes not implemented",
          }
          def reason(cls, name, msg):
              short = cls.rsplit(".", 1)[-1]
              base = name.split("[", 1)[0]
              for key in (short + "." + base, short):
                  if key in REASONS:
                      return REASONS[key] + (" [%s]" % msg if msg else "")
              return msg or "(no message)"
          total = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          skipped = []
          for f in sorted(glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True)):
              root = ET.parse(f).getroot()
              for k in total:
                  total[k] += int(root.get(k, 0) or 0)
              for tc in root.iter("testcase"):
                  s = tc.find("skipped")
                  if s is not None:
                      skipped.append("%s.%s: %s" % (tc.get("classname"), tc.get("name"), reason(tc.get("classname"), tc.get("name"), s.get("message"))))
          print("Surefire totals across all modules: %s" % total)
          print("Skipped tests (%d):" % len(skipped))
          for s in skipped:
              print("  SKIPPED " + s)
          EOF
          echo "Local S3 server errors (if any):"
          sudo awk '/Traceback/{c=25} c&&c--' /tmp/moto.log | tail -60

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jgit-jar
          path: org.eclipse.jgit/target/org.eclipse.jgit-5.1.3.201810200350-r.jar
          if-no-files-found: error
